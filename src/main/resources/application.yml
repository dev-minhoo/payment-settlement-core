spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/psc?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      group-id: psc-settlement
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  batch:
    job:
      enabled: false              # 기동 시 자동 실행하지 않음. 실행은 JobOperator로 명시적으로
    jdbc:
      initialize-schema: always   # BATCH_ 메타 테이블(실행 이력·재시작 정보)을 MySQL에 생성
  sql:
    init:
      mode: always                # schema.sql(대사 결과 테이블) 실행. CREATE TABLE IF NOT EXISTS라 재실행 안전

psc:
  kafka:
    topic:
      payment-events: payment-events
  outbox:
    relay:
      enabled: true          # 테스트에서는 build.gradle에서 false로 덮어쓴다
      fixed-delay-ms: 1000   # 직전 실행이 끝난 뒤 1초 쉬고 다시 조회
      send-timeout-ms: 5000  # 브로커 ack 대기 한도
  reconciliation:
    chunk-size: 100          # 대사 배치 청크 크기(커밋 단위)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
